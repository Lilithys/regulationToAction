services:
  - type: web
    name: regulation-to-action-demo-api
    runtime: python
    plan: free
    region: singapore
    branch: deploy/temporary-demo
    rootDir: reguagent-main
    buildCommand: pip install -r requirements.txt
    startCommand: python agent/serve_demo.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEMO_STATE_DIR
        value: /tmp/regulation-to-action-demo
      - key: CORS_ALLOW_ORIGIN
        value: https://northstar-regulation-demo.yishanmai330.chatgpt.site
